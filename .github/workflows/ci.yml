name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }} - Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Verify compilation and syntax
        run: |
          python -m compileall src

      - name: Run test suite with pytest
        env:
          PYTHONPATH: .
        run: |
          pytest -v --durations=10

      - name: Execute CLI smoke tests
        env:
          PYTHONPATH: .
        run: |
          titan-vasc --help
          python -m titan_vasc.cli benchmark
          python -m titan_vasc.cli inspect --diameter 5.5
          python -m titan_vasc.cli calibrate --diameter 5.2 --samples 30
          python -m titan_vasc.cli demo

      - name: Execute standalone examples
        env:
          PYTHONPATH: .
        run: |
          python examples/01_healthy_vs_aneurysm_hemodynamics.py
          python examples/02_hgo_hyperelastic_rupture_risk.py
          python examples/03_wave_intensity_windkessel_coupling.py
          python examples/04_patient_clinical_trial_simulation.py
